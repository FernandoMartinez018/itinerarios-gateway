server:
  port: 8080

# NOTA DE VERIFICACIÓN OBLIGATORIA:
# Desde el release train Spring Cloud 2025.0, los artefactos de Spring Cloud
# Gateway se renombraron y separaron por stack (WebFlux/WebMVC). No se pudo
# confirmar en este entorno, carácter por carácter, si la ruta de configuración
# sigue siendo "spring.cloud.gateway.routes" (compatibilidad retro) o cambió a
# "spring.cloud.gateway.server.webflux.routes" con el nuevo starter.
# Antes de ejecutar: correr `mvn spring-boot:run` con logging DEBUG en
# org.springframework.cloud.gateway y confirmar en el log de arranque que las
# rutas "airport-service" e "itinerary-service" se registraron correctamente.
# Si no se registran, ajustar el prefijo de esta sección según la documentación
# vigente de spring-cloud-starter-gateway-server-webflux 2025.1.1.
spring:
  application:
    name: gateway

  security:
    oauth2:
      client:
        # Token de servicio del Gateway (paso 31): Client Credentials contra Keycloak.
        registration:
          gateway:
            client-id: gateway
            client-secret: ${OAUTH2_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: airport.read,itinerary.read,itinerary.write,notification.read
          # Login de usuarios del frontend (BFF, ADR-018): Authorization Code + PKCE, mismo cliente confidencial.
          keycloak:
            client-id: gateway
            client-secret: ${OAUTH2_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          gateway:
            token-uri: ${OAUTH2_TOKEN_URI:http://localhost:8180/realms/itinerarios/protocol/openid-connect/token}
          keycloak:
            # Relativa a proposito: el navegador llega a Keycloak por el nginx del frontend (mismo origen).
            authorization-uri: /realms/itinerarios/protocol/openid-connect/auth
            # El resto va por la red interna (backchannel).
            token-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/itinerarios/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/itinerarios/protocol/openid-connect/certs
            # Sin user-info-uri a proposito: nombre y correo vienen en el ID token, y Keycloak rechazaria el
            # access token en /userinfo por la red interna (su iss es el host del navegador, no keycloak:8080).
            user-name-attribute: preferred_username

  cloud:
    gateway:
      server:
        webflux:
          # La cookie de sesion del usuario no sale del Gateway: los servicios reciben solo el token de servicio.
          default-filters:
            - RemoveRequestHeader=Cookie
          routes:
            - id: airport-service
              uri: ${AIRPORT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/airports/**
            - id: itinerary-service
              uri: ${ITINERARY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/itineraries/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/notifications/**

gateway:
  auth:
    end-session-path: /realms/itinerarios/protocol/openid-connect/logout
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200}
  rate-limit:
    requests-per-second: ${RATE_LIMIT_RPS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId}]"
